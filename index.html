<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>MWSS RO | Citizen's Charter 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #f8f9fc 0%, #eef2f8 100%);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      color: #0b1e33;
    }

    .app-container {
      max-width: 1300px;
      width: 100%;
      background: #ffffff;
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px rgba(0, 20, 50, 0.1), 0 10px 25px rgba(0,0,0,0.05);
      padding: 2rem 2.5rem 3rem;
    }

    /* header with logo */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
      border-bottom: 2px solid #e9c46a;
      padding-bottom: 1.5rem;
    }

    .logo img {
      height: 70px;
      width: auto;
      object-fit: contain;
      background: transparent;
      border-radius: 8px;
      display: block;
    }

    .logo-fallback {
      display: none;
      align-items: center;
      gap: 0.5rem;
      background: #0a2f44;
      color: white;
      padding: 0.8rem 1.5rem;
      border-radius: 18px;
      font-weight: 700;
      font-size: 1.2rem;
    }
    .logo-fallback span {
      color: #e6b422;
    }

    .title-section h1 {
      font-size: 2.3rem;
      font-weight: 700;
      color: #0a2f44;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .title-section .sub {
      font-size: 1rem;
      font-weight: 500;
      color: #b68b2c;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 0.2rem;
    }

    /* services grid */
    .services-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.8rem;
      margin: 2rem 0 2.8rem;
    }

    .column {
      flex: 1 1 350px;
      background: #f7f9fd;
      border-radius: 2rem;
      padding: 1.5rem 1.3rem;
      box-shadow: 0 10px 18px rgba(0,0,0,0.03);
      border: 1px solid #e8edf5;
    }

    .column h2 {
      font-size: 1.4rem;
      font-weight: 650;
      color: #0a2f44;
      margin-bottom: 1.3rem;
      padding-bottom: 0.5rem;
      border-bottom: 3px solid #e6b422;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .service-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .service-btn {
      background: white;
      border: 1px solid #dce3f0;
      padding: 0.85rem 1.2rem;
      border-radius: 1.2rem;
      font-weight: 550;
      color: #1e3b5c;
      text-align: left;
      transition: 0.2s ease;
      cursor: pointer;
      font-size: 0.92rem;
      line-height: 1.4;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      word-break: break-word;
    }

    .service-btn:hover {
      background: #e6b422;
      border-color: #c99b1e;
      color: #0a2f44;
      box-shadow: 0 12px 18px -8px rgba(198, 160, 30, 0.35);
      transform: translateY(-2px);
      font-weight: 600;
    }

    .service-btn .tag {
      font-size: 0.68rem;
      background: #e6b422;
      color: #0a2f44;
      padding: 0.15rem 0.6rem;
      border-radius: 20px;
      margin-left: auto;
      font-weight: 650;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .service-btn:hover .tag {
      background: #0a2f44;
      color: white;
    }

    /* detail panel */
    .detail-card {
      background: #ffffff;
      border: 1px solid #e6eefc;
      border-radius: 2rem;
      padding: 2rem 2rem 1.8rem;
      margin-top: 1.5rem;
      box-shadow: 0 18px 30px -12px rgba(0,32,64,0.08);
      display: none;
    }

    .detail-card.active {
      display: block;
    }

    .detail-header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      background: #f0f4fe;
      padding: 1rem 1.5rem;
      border-radius: 1.5rem;
    }

    .detail-header h3 {
      font-size: 1.9rem;
      font-weight: 700;
      color: #0a2f44;
      flex: 1;
    }

    .meta-badge {
      background: #0a2f44;
      color: white;
      padding: 0.4rem 1.2rem;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .info-block {
      background: #fafcff;
      border-radius: 1.2rem;
      padding: 1.3rem 1.5rem;
      margin: 1.2rem 0;
    }

    .info-block h4 {
      color: #0a2f44;
      margin-bottom: 0.5rem;
    }

    .requirements-list {
      list-style-type: none;
      margin-top: 0.6rem;
    }
    .requirements-list li {
      margin-bottom: 0.5rem;
      padding-left: 1.4rem;
      position: relative;
    }
    .requirements-list li::before {
      content: "•";
      color: #b68b2c;
      font-weight: bold;
      position: absolute;
      left: 0;
    }

    .btn-back {
      background: none;
      border: 2px solid #b68b2c;
      color: #0a2f44;
      padding: 0.6rem 1.8rem;
      border-radius: 2.5rem;
      font-weight: 600;
      margin-top: 1.5rem;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.95rem;
    }
    .btn-back:hover {
      background: #e6b422;
      border-color: #b68b2c;
    }

    .footer-note {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #5f6b7a;
      text-align: center;
    }

    @media (max-width: 700px) {
      .app-container {
        padding: 1.5rem 1.2rem;
      }
      .detail-header h3 {
        font-size: 1.4rem;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

  </div>
  <div class="footer-note">
    MWSS Regulatory Office · Katipunan Ave., Balara, Quezon City
  </div>
</div>

  function showDetail(serviceId) {
    const data = serviceData[serviceId];
    if (!data) return;

    let html = `
      <div class="detail-header">
        <h3>${data.title}</h3>
        <span class="meta-badge">${data.classification}</span>
      </div>
      <div class="info-block">
        <p><strong>📌 Office/Division:</strong> ${data.office}</p>
        <p><strong>📋 Type of Transaction:</strong> ${data.type}</p>
        <p><strong>👥 Who may avail:</strong> ${data.who}</p>
        <p><strong>⏱️ Processing Time:</strong> ${data.processingTime}</p>
        <p><strong>💰 Fees:</strong> ${data.fees}</p>
      </div>
      <div class="info-block">
        <h4>📎 Checklist of Requirements</h4>
        <ul class="requirements-list">
          ${data.checklist.map(item => `<li>${item}</li>`).join('')}
        </ul>
      </div>
      <div class="info-block">
        <h4>🔄 Client Steps / Agency Actions</h4>
        <ol style="padding-left:1.4rem; margin-top:0.5rem;">
          ${data.steps.map(step => `<li style="margin-bottom:0.4rem;">${step}</li>`).join('')}
        </ol>
      </div>
    `;

    document.getElementById('detailContent').innerHTML = html;
    document.getElementById('detailContainer').classList.add('active');
    document.getElementById('servicesGrid').style.display = 'none';
    document.getElementById('detailContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function hideDetail() {
    document.getElementById('detailContainer').classList.remove('active');
    document.getElementById('servicesGrid').style.display = 'flex';
    document.getElementById('servicesGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
</script>
